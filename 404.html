<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f0b52f">
  <title>Pagina non trovata — Sanafollia</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f0b52f;color:#181712;font-family:Arial,Helvetica,sans-serif;padding:24px}main{width:min(900px,100%);border:2px solid #181712;background:#f4efe3;padding:clamp(28px,7vw,80px);position:relative;box-shadow:14px 14px 0 #181712;clip-path:polygon(1% 0,100% 3%,98% 100%,0 97%)}.mark{width:56px;height:56px;border:2px solid #181712;border-radius:16px;transform:rotate(45deg);display:grid;place-items:center}.mark:after{content:"";width:14px;height:14px;border-radius:50%;background:#f0b52f}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;margin:34px 0 16px}h1{font-size:clamp(64px,13vw,150px);line-height:.78;letter-spacing:-.07em;text-transform:uppercase;margin:0 0 28px}h1 em{font-family:Georgia,serif;font-weight:400;text-transform:none}p{font-size:18px;max-width:600px}a{display:inline-flex;margin-top:18px;background:#181712;color:#fff;text-decoration:none;padding:14px 20px;border-radius:999px;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <p class="eyebrow">404 · FUORI MENU</p>
    <h1>Questa pagina<br><em>non c'è.</em></h1>
    <p>La strada giusta porta di nuovo alla demo di Sanafollia.</p>
    <a href="/">Torna alla home</a>
  </main>
</body>
</html>
